<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application Page</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="card">
        <header>
            <h1>WEATHER APPLICATION</h1>
        </header>
        <section class="card2">
            <form id="form">
                <input class="input" type="text" placeholder="Search City...">
                <button class="button">🔍</button>
            </form>
            <div class="city" style="font-size: 60px;font-weight: 900;">Nairobi</div>
            <div class="temp" style="color: rgb(190, 190, 46)">23.0°C</div>
            <div style="display: flex; justify-content: space-around; align-items: center;">
                <div class="humidity">
                    <p>Humidity</p>
                    <div class="humid" style="font-size: 30px; color: rgb(190, 190, 46);">67%</div>
                </div>
                <div class="wind">
                    <p>Wind Speed</p>
                    <div class="speed" style="font-size: 30px;color: rgb(190, 190, 46)">5.35Km/hr</div>
                </div>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
